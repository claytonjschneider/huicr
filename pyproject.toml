[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huicr"
version = "0.1.0"
description = "A commit-aware, persistent personal code-review pane for Herdr"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
huicr = "huicr.cli:main"

[tool.setuptools]
packages = ["huicr"]

[tool.ruff.lint]
extend-select = ["W291", "W293"]
