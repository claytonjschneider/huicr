name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    timeout-minutes: 10
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Git, state, delivery, PR history, and interactive terminal tests
        run: python -m unittest discover -s tests -v
      - name: Check installable package and entrypoints
        run: |
          python -m pip install --no-deps .
          huicr --version
          sh bin/huicr --version

  lint:
    name: Python and manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.7.4
      - run: ruff check --no-cache .
      - name: Validate manifests and shell launcher
        run: |
          python -c 'import tomllib; [tomllib.load(open(p, "rb")) for p in ("pyproject.toml", "herdr-plugin.toml", "config.toml.example")]'
          sh -n bin/huicr
          git diff --check

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan all reachable history with Gitleaks 8.30.1
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --log-opts="--all" --redact --no-banner .
